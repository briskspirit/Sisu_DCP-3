<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#42e37d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#10151c"/>
  <image href="revb2_switch_bottom.png" x="0" y="70" width="1000" height="820"/>
  <rect x="0" y="0" width="1600" height="70" fill="#10151c"/>
  <text x="34" y="43" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700">REV B2 RF THROW SHUNTS</text>
  <text x="970" y="43" fill="#aeb8c5" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif" font-size="18">PHYSICAL BOTTOM-SIDE VIEW - TOP OF PHONE</text>

  <!-- Paired shunts in the mirrored physical bottom-side manufacturing view. -->
  <rect x="303" y="234" width="104" height="101" rx="8" fill="#ffb000" fill-opacity="0.10"
        stroke="#ffb000" stroke-width="5"/>
  <rect x="303" y="336" width="104" height="106" rx="8" fill="#f064a4" fill-opacity="0.10"
        stroke="#f064a4" stroke-width="5"/>
  <rect x="548" y="234" width="104" height="101" rx="8" fill="#42e37d" fill-opacity="0.12"
        stroke="#42e37d" stroke-width="6"/>
  <rect x="548" y="336" width="104" height="106" rx="8" fill="#46a7ff" fill-opacity="0.10"
        stroke="#46a7ff" stroke-width="5"/>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700"
     paint-order="stroke" stroke="#10151c" stroke-width="5">
    <text x="292" y="272" text-anchor="end">ZP5</text>
    <text x="292" y="319" text-anchor="end">ZP7</text>
    <text x="292" y="365" text-anchor="end">ZP9</text>
    <text x="292" y="412" text-anchor="end">ZP11</text>
    <text x="665" y="272">ZP6</text>
    <text x="665" y="319">ZP8</text>
    <text x="665" y="365">ZP10</text>
    <text x="665" y="412">ZP12</text>
  </g>
  <g stroke="#ffffff" stroke-width="2" opacity="0.85">
    <path d="M296 266 H303"/><path d="M296 313 H303"/>
    <path d="M296 359 H303"/><path d="M296 406 H303"/>
    <path d="M652 266 H660"/><path d="M652 313 H660"/>
    <path d="M652 359 H660"/><path d="M652 406 H660"/>
  </g>

  <rect x="432" y="299" width="97" height="103" rx="8" fill="none"
        stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="480" y="425" fill="#ffffff" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        paint-order="stroke" stroke="#10151c" stroke-width="5">IC1 BGSA14</text>

  <rect x="1018" y="92" width="548" height="744" rx="8" fill="#171e27" stroke="#35404e" stroke-width="2"/>
  <text x="1052" y="133" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">Exact netlist mapping</text>

  <rect x="1052" y="165" width="8" height="108" fill="#ffb000"/>
  <text x="1080" y="191" fill="#ffb000" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">RF1 - KEY 1 - B2 - 00</text>
  <text x="1080" y="223" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">ZP5 + ZP7</text>
  <text x="1080" y="250" fill="#aeb8c5" font-family="Arial, Helvetica, sans-serif" font-size="18">left upper pair</text>

  <rect x="1052" y="293" width="8" height="108" fill="#f064a4"/>
  <text x="1080" y="319" fill="#f064a4" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">RF2 - KEY 2 - B12/B14 - 10</text>
  <text x="1080" y="351" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">ZP9 + ZP11</text>
  <text x="1080" y="378" fill="#aeb8c5" font-family="Arial, Helvetica, sans-serif" font-size="18">left lower pair</text>

  <rect x="1052" y="421" width="8" height="122" fill="#42e37d"/>
  <text x="1080" y="447" fill="#42e37d" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">RF3 - KEY 3 - B5 - 01</text>
  <text x="1080" y="479" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">ZP6 + ZP8</text>
  <text x="1080" y="506" fill="#aeb8c5" font-family="Arial, Helvetica, sans-serif" font-size="18">right upper pair - START HERE</text>
  <path d="M1050 493 C930 493, 820 365, 662 305" fill="none" stroke="#42e37d"
        stroke-width="5" marker-end="url(#arrow-green)" filter="url(#shadow)"/>

  <rect x="1052" y="563" width="8" height="108" fill="#46a7ff"/>
  <text x="1080" y="589" fill="#46a7ff" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">RF4 - KEY 4 - B4 - 11</text>
  <text x="1080" y="621" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">ZP10 + ZP12</text>
  <text x="1080" y="648" fill="#aeb8c5" font-family="Arial, Helvetica, sans-serif" font-size="18">right lower pair</text>

  <line x1="1052" y1="700" x2="1532" y2="700" stroke="#35404e" stroke-width="2"/>
  <text x="1052" y="734" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="700">Each color = two parallel 0402 shunts to GND.</text>
  <text x="1052" y="765" fill="#aeb8c5" font-family="Arial, Helvetica, sans-serif" font-size="18">Record the exact ZP used: same net, different RF</text>
  <text x="1052" y="790" fill="#aeb8c5" font-family="Arial, Helvetica, sans-serif" font-size="18">placement parasitics.</text>
  <text x="1052" y="818" fill="#7f8c9b" font-family="Arial, Helvetica, sans-serif" font-size="15">Source: revB2_07232026 manufacturing PCB + exported netlist</text>
</svg>
